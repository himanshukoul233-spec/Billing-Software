async function enterDashboard(u){if(!u)return;currentUser=u;screen(&quot;shopView&quot;);go(&quot;homePage&quot;);$(&quot;welcomeShop&quot;).textContent=u.user_metadata?.shop_name||&quot;My Shop&quot;;$(&quot;welcomeOwner&quot;).textContent=&quot;Owner: &quot;+(u.user_metadata?.owner_name||&quot;Shop Owner&quot;);$(&quot;welcomeEmail&quot;).textContent=u.email||&quot;&quot;;$(&quot;settingShop&quot;).textContent=&quot;Shop: &quot;+(u.user_metadata?.shop_name||&quot;-&quot;);$(&quot;settingOwner&quot;).textContent=&quot;Owner: &quot;+(u.user_metadata?.owner_name||&quot;-&quot;);$(&quot;settingEmail&quot;).textContent=&quot;Email: &quot;+(u.email||&quot;-&quot;);$(&quot;settingUsername&quot;).textContent=&quot;Username: &quot;+(u.user_metadata?.username||&quot;-&quot;);$(&quot;settingPlan&quot;).textContent=&quot;Plan: Account plan managed by administrator&quot;;$(&quot;settingExpiry&quot;).textContent=&quot;&quot;;$(&quot;settingStatus&quot;).textContent=&quot;Status: Logged in&quot;;
