  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Vyapar Book</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#172554;color:white;padding:20px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;color:#cbd5e1}
.container{max-width:480px;margin:25px auto;padding:12px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:15px;box-shadow:0 3px 15px #0000000d}
h2{margin-top:0;font-size:21px}
label{display:block;margin:13px 0 6px;font-size:14px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{padding:12px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:15px;font-weight:bold;width:100%;margin-top:15px}
button.secondary{background:#e2e8f0;color:#172554}
button:disabled{opacity:.6}
.msg{font-size:14px;line-height:1.5;margin-top:12px;overflow-wrap:anywhere}
.hidden{display:none}
.muted{color:#64748b;font-size:13px}
.status{background:#fef3c7;color:#92400e;padding:12px;border-radius:8px;margin-top:15px}
</style>
</head>

<body>

<header>
<h1>Vyapar Book</h1>
<p>Smart Billing & Shop Management</p>
</header>

<div class="container">

<section id="authView">

<div class="card">
<h2>Login</h2>
<p class="muted">Login to your shop account</p>

<form id="loginForm">
<label>Email</label>
<input type="email" name="email" required>

<label>Password</label>
<input type="password" name="password" required>

<button id="loginBtn" type="submit">Login</button>
</form>

<p id="loginMsg" class="msg"></p>
</div>

<div class="card">
<h2>Register Your Shop</h2>
<p class="muted">Create your Vyapar Book account</p>

<form id="registerForm">

<label>Shop Name *</label>
<input name="shopName" maxlength="150" required>

<label>Owner Name *</label>
<input name="ownerName" maxlength="150" required>

<label>Email *</label>
<input name="email" type="email" required>

<label>Mobile Number</label>
<input name="phone" type="tel" maxlength="15">

<label>Username *</label>
<input name="username" maxlength="100" required>

<label>Password (minimum 12 characters) *</label>
<input name="password" type="password" minlength="12" required>

<button id="registerBtn" type="submit">Register Shop</button>

</form>

<p id="registerMsg" class="msg"></p>
</div>

</section>

<section id="shopView" class="hidden">

<div class="card">
<h2>Welcome to Vyapar Book</h2>
<p id="shopName"></p>
<p id="shopEmail" class="muted"></p>

<div class="status" id="shopStatus">
Your registration is pending approval.
</div>

<button class="secondary" id="logoutBtn">Logout</button>
</div>

</section>

</div>

<script>
const SUPABASE_URL =
"https://fhxyeccekxbwergdwthx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Zu3FsfPnBuhjh9l_4TfWYw_v7-MWH62";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function message(id, text, success=false) {
  const el = $(id);
  el.textContent = text;
  el.style.color = success ? "green" : "#b91c1c";
}

function showDashboard(profile) {
  $("authView").classList.add("hidden");
  $("shopView").classList.remove("hidden");

  $("shopName").textContent =
    profile.shop_name + " · " + profile.owner_name;

  $("shopEmail").textContent = profile.email;

  const status = $("shopStatus");

  if (profile.status === "active") {
    status.textContent = "Your shop account is active.";
    status.style.background = "#dcfce7";
    status.style.color = "#166534";
  } else if (profile.status === "suspended") {
    status.textContent = "Your shop account is suspended. Contact administrator.";
    status.style.background = "#fee2e2";
    status.style.color = "#991b1b";
  } else {
    status.textContent = "Registration successful! Waiting for admin approval.";
  }
}


async function loadProfile(user) {
  console.log("Logged-in Email:", user.email);

  const { data, error } = await supabaseClient
    .from("shop_profiles")
    .select("*")
    .eq("id", user.id);

  console.log("Profile Data:", data);
  console.log("Profile Error:", error);

  if (error) {
    throw new Error("Profile database error: " + error.message);
  }

  if (!data || data.length === 0) {
    throw new Error(
      "Profile not visible. Check Supabase RLS policies."
    );
  }

  if (data.length > 1) {
    throw new Error("Multiple shop profiles found.");
  }

  showDashboard(data[0]);
}

// SHOP REGISTRATION

$("registerForm").addEventListener("submit", async e => {
  e.preventDefault();

  const btn = $("registerBtn");
  btn.disabled = true;
  btn.textContent = "Registering...";

  message("registerMsg", "");

  const f = new FormData(e.target);

  const shopName = f.get("shopName").trim();
  const ownerName = f.get("ownerName").trim();
  const email = f.get("email").trim();
  const phone = f.get("phone").trim();
  const username = f.get("username").trim().toLowerCase();
  const password = f.get("password");

  try {
    if (!shopName || !ownerName || !email || !username || !password) {
      throw new Error("Please fill all required fields.");
    }

    if (!/^[a-z0-9_]{3,30}$/.test(username)) {
      throw new Error("Username must be 3-30 characters (letters, numbers or underscore).");
    }

    if (password.length < 12) {
      throw new Error("Password must have at least 12 characters.");
    }

    const { data, error } = await supabaseClient.auth.signUp({
  email,
  password,
  options: {
    emailRedirectTo: "https://himanshukoul233-spec.github.io/Billing-Software/",
    data: {
      shop_name: shopName,
      owner_name: ownerName,
      phone,
      username
    }
  }
});

    if (error) throw error;

    e.target.reset();

    if (data.session && data.user) {
      await loadProfile(data.user);
      message("registerMsg", "Registration successful!", true);
    } else {
      message(
        "registerMsg",
        "Registration successful! Please verify your email using the link sent to your inbox.",
        true
      );
    }

  } catch (err) {
    message("registerMsg", err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Register Shop";
  }
});

// SHOP LOGIN

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "Logging in...";

  message("loginMsg", "");

  const f = new FormData(e.target);

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: f.get("email").trim(),
        password: f.get("password")
      });

    if (error) throw error;

    await loadProfile(data.user);

  } catch (err) {
    message("loginMsg", err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Login";
  }
});

// LOGOUT

$("logoutBtn").addEventListener("click", async () => {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  showLogin();
});

// EXISTING LOGIN SESSION

(async () => {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    message("loginMsg", error.message);
    return;
  }

  if (data.session) {
    try {
      await loadProfile(data.session.user);
    } catch (err) {
      message("loginMsg", err.message);
    }
  }
})();

</script>

</body>
</html>
